apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opspilot-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opspilot
                port:
                  number: 8080
