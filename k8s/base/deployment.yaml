apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot
  template:
    metadata:
      labels:
        app: opspilot
    spec:
      containers:
        - name: opspilot
          image: jr31112/opspilot:latest
          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: opspilot-db

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi