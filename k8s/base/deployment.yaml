apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot
  template:
    metadata:
      labels:
        app: opspilot
    spec:
      containers:
        - name: opspilot
          image: jr31112/opspilot:latest
          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: opspilot-db
            - configMapRef:
                name: opspilot-config

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: OTEL_SERVICE_NAME
              value: "opspilot"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318"

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"

            - name: OTEL_METRICS_EXPORTER
              value: "none"

            - name: OTEL_LOGS_EXPORTER
              value: "none"
