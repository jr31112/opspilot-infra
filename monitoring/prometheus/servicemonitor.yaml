apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opspilot
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: opspilot
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s